version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: synth_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: synth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d synth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse_server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/synth_db
      - NEXTAUTH_SECRET=supersecret_nextauth_key_123
      - SALT=supersecret_salt_key_123
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false

volumes:
  pgdata: